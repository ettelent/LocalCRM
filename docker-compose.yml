services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    restart: unless-stopped

  server:
    image: node:22-alpine
    working_dir: /app
    env_file: .env
    environment:
      DB_DRIVER: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm
      MYSQL_DATABASE: crm
      CLIENT_ORIGIN: http://localhost:5173,http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: sh -c "npm install && node src/wait-for-db.js && npm run dev"
    ports:
      - "3000:3000"
    restart: unless-stopped
  client:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - server
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  mysql_data:
  server_node_modules:
  client_node_modules:
