services:
  server:
    build: ./server
    env_file: .env
    environment:
      DB_PATH: /app/data/crm.db
      CLIENT_ORIGIN: http://localhost:8080
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped
  client:
    build: ./client
    depends_on:
      - server
    ports:
      - "8080:80"
    restart: unless-stopped
